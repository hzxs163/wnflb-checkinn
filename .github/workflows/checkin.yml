# .github/workflows/checkin.yml
name: 福利吧自动签到

on:
  schedule:
    # 北京时间 09:00 与 22:00（对应 UTC 01:00 / 14:00）
    - cron: "0 1,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # 私有仓库必须保留，保障 actions/cache 正常写入 cookies.json

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 列出目录文件，确认文件存在
        run: ls -la *.py

      - name: 恢复 Cookie 缓存
        uses: actions/cache@v4
        with:
          path: cookies.json
          key: wnflb-cookies-${{ github.run_id }}
          restore-keys: |
            wnflb-cookies-

      - name: 执行签到
        env:
          FORUM_USERNAME: ${{ secrets.FORUM_USERNAME }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
          FORUM_COOKIE: ${{ secrets.FORUM_COOKIE }}

          # Telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # Bark
          BARK_URL: ${{ secrets.BARK_URL }}

          # Gotify
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}

          # WxPusher
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}

          # 企业微信机器人 webhook
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

          # NotifyX
          NOTIFYX_URL: ${{ secrets.NOTIFYX_URL }}
          NOTIFYX_TOKEN: ${{ secrets.NOTIFYX_TOKEN }}

          # 通用 Webhook
          GENERIC_WEBHOOK: ${{ secrets.GENERIC_WEBHOOK }}

          # 虾推啥
          XIATUISHE_TOKEN: ${{ secrets.XIATUISHE_TOKEN }}
          XIATUISHE_SERVER: ${{ secrets.XIATUISHE_SERVER }}
        run: |
          python -u wnflb_checkin.py 2>&1
          echo "脚本退出码: $?"
